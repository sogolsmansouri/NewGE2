  loss:
    options:
      reduction: SUM
    type: SOFTMAX_CE
  random_seed: 741135446461071584
  sparse_optimizer:
    options:
      learning_rate: 0.1
    type: ADAGRAD
storage:
  dataset:
    dataset_dir: /workspace/tw_1bcaa5c_scaling_20261015/data/tw_p16/
  device_ids:
  - 0
  device_type: cuda
  edges:
    options:
      dtype: int
    type: HOST_MEMORY
  embeddings:
    options:
      buffer_capacity: 4
      dtype: float
      edge_bucket_ordering: CUSTOM
      fine_to_coarse_ratio: 1
      num_cache_partitions: 0
      num_partitions: 16
      prefetching: false
      randomly_assign_edge_buckets: false
    type: MEM_PARTITION_BUFFER
  full_graph_evaluation: false
  log_level: info
  model_dir: /workspace/tw_b1a92d1_scaling_20261015/cases/1gpu/model/
  prefetch: true
  shuffle_input: true
training:
  batch_size: 50000
  checkpoint:
    interval: -1
